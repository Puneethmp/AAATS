app = "aaats-trader"
primary_region = "sin"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  AAATS_DATA       = "/app/data"
  AAATS_LOGS       = "/app/data/logs"

[[mounts]]
  source      = "aaats_data"
  destination = "/app/data"

[http_service]
  internal_port        = 8501
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    interval     = "60s"
    timeout      = "15s"
    grace_period = "60s"
    method       = "GET"
    path         = "/_stcore/health"

[vm]
  size   = "shared-cpu-1x"
  memory = "512mb"
