apiVersion: 1

# Grafana unified-alerting rule for the SELL/BUY share-equality detector.
#
# Datasource UID (`aaats-prom`) and folder title (`AAATS`) match
# `deployment/grafana/provisioning/datasources/prometheus.yml` and the
# folder auto-created by `deployment/grafana/provisioning/dashboards/dashboards.yml`.
#
# Routing: the `telegram` contact point referenced here is provisioned
# OUTSIDE this repo on the box (file at
# `/srv/aaats/compose/grafana/provisioning/alerting/telegram_contact.yaml`)
# because the bot token + chat id are operator secrets and live in
# `/srv/aaats/secrets/` rather than git. If the contact point ever goes
# missing, the policy falls back to the root default via Grafana's normal
# routing rules.
#
# Source metric: aaats_share_equality_mismatch_total{strategy,symbol}
# Produced by:   execution/paper_trader.py:_bump_share_mismatch_counter()
#                via data/share_equality_mismatches.json
# Scraped by:    monitoring/metrics_exporter.py:collect_share_equality()
#                on aaats-metrics:9091

groups:
  - orgId: 1
    name: share_equality
    folder: AAATS
    interval: 1m
    rules:
      - uid: share_equality_mismatch
        title: SELL/BUY share-equality mismatch detected
        condition: A_above_zero
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: aaats-prom
            model:
              expr: |
                sum by (strategy, symbol) (
                  increase(aaats_share_equality_mismatch_total{strategy!="_none"}[1h])
                )
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: A_above_zero
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: A_above_zero
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Share-equality WARN fired in last 1h"
          description: "paper_trader detected SELL.shares != FIFO BUY.shares for one or more (strategy, symbol) pairs. Inspect docker logs aaats-paper-crypto | grep 'SELL/BUY share mismatch' and consult docs/known_issues/2026-05-15_buy_side_audit.md."
        labels:
          severity: high
          component: paper_trader

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: telegram
        matchers:
          - severity = "high"
          - component = "paper_trader"
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 1h
