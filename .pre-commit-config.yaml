# Pre-commit hooks for AAATS.
#
# Install once per workstation:
#   pip install pre-commit
#   pre-commit install
#
# Then every `git commit` runs these hooks. To skip in an emergency:
#   git commit --no-verify
# (Do NOT use --no-verify on changes that touch broker, risk, or deploy code.)

repos:
  # ── Secret scanning — blocks commits containing credentials ────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (block secrets from being committed)

  # ── Generic hygiene ───────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]   # block accidentally-committed DBs / model weights
      - id: check-merge-conflict
      - id: detect-private-key

  # ── Python lint + format (matches CI) ─────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Python security scanning (subset; ops scripts allowed subprocess) ────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args:
          - --skip=B101,B404,B603,B607
        exclude: ^tests/
