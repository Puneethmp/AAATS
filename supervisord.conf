[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:runner]
command=python /app/scripts/continuous_runner.py
directory=/app
autostart=true
autorestart=true
startretries=999
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",AAATS_DATA="/app/data",AAATS_LOGS="/app/data/logs"

[program:streamlit]
command=streamlit run /app/streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.fileWatcherType=none --server.enableCORS=false
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",AAATS_DATA="/app/data",AAATS_LOGS="/app/data/logs"
