name: AAATS Autonomous Build

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (4 times per day)

  workflow_dispatch:

jobs:
  autonomous-build:
    runs-on: ubuntu-latest

    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Read session state
        run: |
          echo "=== READING SESSION STATE ==="
          cat SESSION_STATE.md
          echo ""
          echo "=== ENVIRONMENT SETUP ==="
          python --version
          pytest --version

      - name: Configure Git
        run: |
          git config --global user.name "Claude Autonomous Builder"
          git config --global user.email "claude-build@aaats.dev"

      - name: Run autonomous build with Claude API
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          echo "=== RUNNING AUTONOMOUS BUILD ==="
          echo "Claude API key present: $( [ -n "$CLAUDE_API_KEY" ] && echo YES || echo NO )"
          python scripts/autonomous_build.py

      - name: Run tests
        run: |
          echo "=== POST-BUILD TESTS ==="
          pytest tests/ -v --tb=short -q || true

      - name: Generate build summary
        if: always()
        run: |
          echo "## AAATS Autonomous Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Build session executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next scheduled run:** In 6 hours" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Claude API:** Active (autonomous code generation)" >> $GITHUB_STEP_SUMMARY

      - name: Send Telegram failure notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🚨 AAATS BUILD FAILED\\n\\nCheck logs at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\\n\\nRun: ${{ github.run_id }}\"}"

      - name: Send Telegram success notification
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(head -20 SESSION_STATE.md 2>/dev/null || echo "No session state available")
          TEXT="$(printf '✅ AAATS BUILD SUCCESS\n\n%s' "${SUMMARY}")"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

permissions:
  contents: write
  pull-requests: write
