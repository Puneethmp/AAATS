# AAATS v6 — Cloudflare R2 rclone config template
# Install at:  /home/aaats/.config/rclone/rclone.conf
# Mode:        0600  (owner aaats:aaats)
# Reference:   https://developers.cloudflare.com/r2/examples/rclone/
#
# Replace the four <PLACEHOLDERS> with your R2 credentials before saving.
# Account ID is the 32-char hex visible at https://dash.cloudflare.com/<account_id>/r2

[r2]
type             = s3
provider         = Cloudflare
access_key_id    = <R2_ACCESS_KEY_ID>
secret_access_key = <R2_SECRET_ACCESS_KEY>
endpoint         = https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com
acl              = private
no_check_bucket  = true
